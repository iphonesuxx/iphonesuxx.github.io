<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iphonesuxx.github.io - Guestbook 98</title>
  <style>
    /* Classic Windows 98 / Late-90s Web Aesthetic */
    body {
      background-color: #008080; /* Classic Win98 Teal */
      font-family: "MS Sans Serif", "Tahoma", "Verdana", sans-serif;
      font-size: 13px;
      color: #000000;
      margin: 0;
      padding: 24px 12px;
    }

    /* Beveled 3D Win98 Window */
    .window {
      max-width: 580px;
      margin: 0 auto;
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 2px 2px 0px #000000;
      padding: 3px;
    }

    /* Classic Navy Title Bar */
    .title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
      font-weight: bold;
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.3px;
    }

    .title-buttons span {
      display: inline-block;
      background: #c0c0c0;
      color: #000000;
      font-size: 11px;
      font-weight: bold;
      width: 16px;
      height: 14px;
      text-align: center;
      line-height: 13px;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      margin-left: 2px;
      cursor: default;
    }

    .menu-bar {
      padding: 4px 8px;
      border-bottom: 1px solid #808080;
      font-size: 12px;
    }

    .menu-bar span {
      margin-right: 14px;
    }

    .menu-bar u {
      text-decoration: underline;
    }

    .content {
      padding: 14px;
    }

    fieldset {
      border: 2px groove #ffffff;
      padding: 12px;
      margin-bottom: 14px;
    }

    legend {
      padding: 0 6px;
      font-weight: bold;
    }

    form {
      display: flex;
      gap: 8px;
    }

    /* Sunken 98 Text Input */
    input[type="text"] {
      flex: 1;
      background-color: #ffffff;
      font-family: "MS Sans Serif", "Tahoma", sans-serif;
      font-size: 13px;
      padding: 5px 6px;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      outline: none;
    }

    /* Classic 3D Raised Button */
    button {
      background-color: #c0c0c0;
      color: #000000;
      font-family: "MS Sans Serif", "Tahoma", sans-serif;
      font-size: 13px;
      padding: 4px 16px;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      cursor: pointer;
    }

    button:active {
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 5px 15px 3px 17px;
    }

    /* Sunken White List Box */
    .entries-box {
      background-color: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      min-height: 180px;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      padding: 6px 4px;
      border-bottom: 1px dotted #808080;
      word-break: break-word;
    }

    li:last-child {
      border-bottom: none;
    }

    .status-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      font-size: 12px;
    }

    .status-cell {
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 6px;
      flex: 1;
    }

    .error {
      color: #800000;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .footer-badge {
      text-align: center;
      margin-top: 16px;
      color: #ffffff;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <span>📁 iphonesuxx.github.io - Database.exe</span>
      <div class="title-buttons">
        <span>_</span><span>□</span><span>×</span>
      </div>
    </div>

    <div class="menu-bar">
      <span><u>F</u>ile</span>
      <span><u>E</u>dit</span>
      <span><u>V</u>iew</span>
      <span><u>H</u>elp</span>
    </div>

    <div class="content">
      <div id="errorBox" class="error"></div>

      <fieldset>
        <legend>Post New Message</legend>
        <form id="entryForm">
          <input type="text" id="entryInput" placeholder="Type something here..." required />
          <button type="submit">OK</button>
        </form>
      </fieldset>

      <fieldset>
        <legend>Saved Records</legend>
        <div class="entries-box">
          <ul id="entriesList"><li>Connecting to database...</li></ul>
        </div>
      </fieldset>

      <div class="status-bar">
        <div class="status-cell" id="statusText">Ready</div>
        <div class="status-cell" style="max-width: 130px; text-align: right;">Supabase v2.0</div>
      </div>
    </div>
  </div>

  <div class="footer-badge">
    Best viewed in Internet Explorer 4.0 at 800x600 resolution
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh";

    const supabaseUrl = "https://supabase.co";
    const supabaseKey = "sb_publishable_IdlaJfWz1R3Onuf8fKbFfw_ur862_JV";
    const supabase = createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("entryForm");
    const input = document.getElementById("entryInput");
    const list = document.getElementById("entriesList");
    const errorBox = document.getElementById("errorBox");
    const statusText = document.getElementById("statusText");

    async function loadEntries() {
      statusText.textContent = "Loading records...";
      const { data, error } = await supabase
        .from("entries")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        errorBox.textContent = "⚠ Error: " + error.message;
        statusText.textContent = "Connection failed";
        list.innerHTML = "";
        return;
      }

      errorBox.textContent = "";
      list.innerHTML = "";
      statusText.textContent = (data ? data.length : 0) + " object(s)";

      if (!data || data.length === 0) {
        list.innerHTML = "<li>No entries yet. Type one above and click OK!</li>";
        return;
      }

      data.forEach((row) => {
        const li = document.createElement("li");
        li.textContent = "> " + row.text;
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      statusText.textContent = "Saving...";
      const { error } = await supabase.from("entries").insert([{ text }]);
      if (error) {
        errorBox.textContent = "⚠ Error saving: " + error.message;
        statusText.textContent = "Save failed";
        return;
      }

      input.value = "";
      loadEntries();
    });

    loadEntries();
  </script>
</body>
</html>
